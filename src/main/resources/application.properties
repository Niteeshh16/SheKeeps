spring.config.import=optional:file:.env[.properties]
server.port=${PORT:5000}
server.address=${SERVER_ADDRESS:}
spring.application.name=shekeeps
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shekeeps_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
app.cors-origin=${CORS_ORIGIN:http://localhost:3000}
app.cookie-secure=${COOKIE_SECURE:false}
app.jwt-access-secret=${JWT_ACCESS_SECRET:}
app.jwt-refresh-secret=${JWT_REFRESH_SECRET:}
app.jwt-access-expiration=${JWT_ACCESS_EXPIRES_IN:15m}
app.jwt-refresh-expiration=${JWT_REFRESH_EXPIRES_IN:7d}
app.auth-bypass=${AUTH_BYPASS:false}
